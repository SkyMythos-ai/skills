name: 仓库校验

# 单一校验入口：单测、context-kg lint、仓库静态检查与空白字符检查。
# 矩阵里的 Python 版本都已在本地实跑通过；未验证的版本不要写进来。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装校验依赖
        run: python -m pip install --upgrade pip pyyaml

      - name: 仓库静态检查（Skill 元数据、链接、示例标记）
        run: python -B scripts/check_repo.py

      - name: knowledge-maintainer 单测
        run: python -B -m unittest discover -s skills/knowledge-maintainer/tests -v

      - name: personal-development 单测
        run: python -B -m unittest discover -s skills/personal-development/tests -v

      - name: 本仓库 context-kg lint
        run: python -B skills/knowledge-maintainer/scripts/context_kg_lint.py ./context-kg

      - name: lint 缺依赖时使用专用退出码 3
        run: |
          set -euo pipefail
          # 用一个屏蔽 PyYAML 的入口复现缺依赖环境，确认退出码为 3 且不误报缺少 type。
          output=$(python -B - <<'PY'
          import runpy, sys
          sys.modules["yaml"] = None
          sys.argv = ["context_kg_lint.py", "./context-kg"]
          try:
              runpy.run_path("skills/knowledge-maintainer/scripts/context_kg_lint.py", run_name="__main__")
          except SystemExit as exc:
              raise SystemExit(exc.code or 0)
          PY
          ) || status=$?
          status=${status:-0}
          echo "$output"
          test "$status" -eq 3
          ! grep -q "缺少非空 type" <<<"$output"

      - name: 空白字符检查
        run: |
          set -euo pipefail
          git diff --check
          if git rev-parse -q --verify HEAD~1 >/dev/null; then
            git diff --check HEAD~1 HEAD
          fi